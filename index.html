    function formatPrice(madAmount) {
      const cfg = CURRENCY_CONFIG[STATE.currency] || CURRENCY_CONFIG.MAD;
      const converted = (Number(madAmount || 0) * cfg.rate);
      const formatted = STATE.currency === "MAD"
        ? Math.round(converted).toLocaleString("en-US")
        : converted.toFixed(2);
      return cfg.position === "before" ? `${cfg.symbol}${formatted}` : `${formatted} ${cfg.symbol}`;
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      const colors = type === "error"
        ? "bg-slate-900 border-hotpink text-white"
        : type === "info"
        ? "bg-skybrand border-skybrand text-white"
        : "bg-slate-900 border-skybrand text-white";
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border-l-4 shadow-xl text-sm font-medium transition-all duration-300 ${colors}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(8px)";
        setTimeout(() => el.remove(), 250);
      }, 3200);
    }

    function addAuditLog(action, detail) {
      const now = new Date();
      const ts = now.toISOString().slice(0, 16).replace("T", " ");
      STATE.auditLogs.unshift({
        id: "lg-" + Date.now(),
        timestamp: ts,
        actor: STATE.adminUser ? STATE.adminUser.email : "System",
        action,
        detail
      });
    }

    function statusBadgeClass(status) {
      const map = {
        Pending: "bg-amber-50 text-amber-700 border-amber-200",
        Confirmed: "bg-sky-50 text-sky-700 border-sky-200",
        Packed: "bg-indigo-50 text-indigo-700 border-indigo-200",
        Shipped: "bg-blue-50 text-blue-700 border-blue-200",
        Delivered: "bg-emerald-50 text-emerald-700 border-emerald-200",
        Returned: "bg-orange-50 text-orange-700 border-orange-200",
        Cancelled: "bg-rose-50 text-rose-700 border-rose-200"
      };
      return map[status] || "bg-slate-100 text-slate-700 border-slate-200";
    }

    function addToCart(productId, variant = null, qty = 1) {
      const p = STATE.products.find(x => x.id === productId);
      if (!p || p.stock <= 0) {
        showToast("This item is currently out of stock.", "error");
        return;
      }
      const chosenVariant = variant || `${p.colors[0] || "Default"} / ${p.sizes[0] || "Standard"}`;
      const existing = STATE.cart.find(c => c.productId === productId && c.variant === chosenVariant);
      if (existing) {
        if (existing.qty + qty > p.stock) {
          showToast(`Only ${p.stock} units available in stock.`, "error");
          return;
        }
        existing.qty += qty;
      } else {
        STATE.cart.push({
          productId: p.id,
          name: p.name,
          image: p.images[0],
          price: p.price,
          variant: chosenVariant,
          qty: Math.min(qty, p.stock)
        });
      }
      showToast(`Added "${p.name}" to your cart.`);
      render();
      openCartDrawer();
    }

    function toggleWishlist(productId) {
      const idx = STATE.wishlist.indexOf(productId);
      if (idx >= 0) {
        STATE.wishlist.splice(idx, 1);
        showToast("Removed from wishlist.", "info");
      } else {
        STATE.wishlist.push(productId);
        showToast("Saved to your Yamza wishlist.");
      }
      render();
    }

    function calculateShipping(city, subtotal) {
      const zone = STATE.shippingZones.find(z => z.city === city) || STATE.shippingZones[0];
      if (!zone) return 30;
      return subtotal >= zone.freeThreshold ? 0 : zone.fee;
    }

    function placeOrder({ customerName, phone, city, address, paymentMethod, items, promoCode = null, notes = "" }) {
      const subtotal = items.reduce((s, it) => s + it.price * it.qty, 0);
      let discount = 0;
      if (promoCode) {
        const pc = STATE.promoCodes.find(c => c.code.toUpperCase() === promoCode.toUpperCase() && c.active);
        if (pc && subtotal >= pc.minOrder) {
          discount = pc.type === "percent" ? Math.round(subtotal * (pc.value / 100)) : pc.value;
          pc.uses += 1;
        }
      }
      const shippingFee = calculateShipping(city, subtotal);
      const total = Math.max(0, subtotal - discount + shippingFee);
      const nextNum = 1049 + STATE.orders.length;
      const newOrder = {
        id: `YMZ-${nextNum}`,
        createdAt: new Date().toISOString().slice(0, 16).replace("T", " "),
        customerName: customerName.trim(),
        phone: phone.trim(),
        city,
        address: address.trim(),
        paymentMethod,
        status: "Pending",
        subtotal,
        shippingFee,
        discount,
        total,
        notes,
        items: items.map(it => ({
          productId: it.productId,
          name: it.name,
          variant: it.variant,
          qty: it.qty,
          price: it.price
        }))
      };
      items.forEach(it => {
        const prod = STATE.products.find(p => p.id === it.productId);
        if (prod) {
          prod.stock = Math.max(0, prod.stock - it.qty);
          prod.salesCount += it.qty;
        }
      });
      STATE.orders.unshift(newOrder);
      addAuditLog("New Order Received", `${newOrder.id} (${paymentMethod}) — ${formatPrice(total)} from ${customerName}`);
      return newOrder;
    }

      if (STATE.filters.category !== "All") {

      list = list.filter(p => p.price <= STATE.filters.maxPrice);
      if (STATE.filters.minRating > 0) {

      }
      if (STATE.filters.inStockOnly) {
        list = list.filter(p => p.stock > 0);
      }
      if (STATE.filters.sort === "newest") list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      else if (STATE.filters.sort === "bestselling") list.sort((a, b) => b.salesCount - a.salesCount);
      else if (STATE.filters.sort === "price_asc") list.sort((a, b) => a.price - b.price);
      else if (STATE.filters.sort === "price_desc") list.sort((a, b) => b.price - a.price);
      return list;
    }

      const tabs = [
        { id: "analytics", label: "Dashboard Overview", sub: "Analytics & KPIs" },
        { id: "orders", label: "Orders (Les Commandes)", sub: `${STATE.orders.filter(o => o.status === "Pending").length} pending` },
        { id: "inventory", label: "Inventory (Stockage)", sub: `${STATE.products.length} SKUs` },

        { id: "marketing", label: "Marketing & Shipping", sub: "Promos & Zones" },

      return `

                      <div class="text-sm font-bold">${t.label}</div>

      const pendingCod = STATE.orders.filter(o => o.paymentMethod === "COD" && o.status === "Pending").length;
      const lowStock = STATE.products.filter(p => p.stock <= 8);

      return `

    function getFilteredOrders() {
      return STATE.orders.filter(o => {
        if (STATE.ordersFilter.status !== "All" && o.status !== STATE.ordersFilter.status) return false;
        if (STATE.ordersFilter.search.trim()) {
          const q = STATE.ordersFilter.search.toLowerCase();
          if (!o.id.toLowerCase().includes(q) && !o.customerName.toLowerCase().includes(q) && !o.phone.toLowerCase().includes(q) && !o.city.toLowerCase().includes(q)) return false;
        }
        const oDate = o.createdAt.slice(0, 10);
        if (STATE.ordersFilter.dateFrom && oDate < STATE.ordersFilter.dateFrom) return false;
        if (STATE.ordersFilter.dateTo && oDate > STATE.ordersFilter.dateTo) return false;
        return true;
      });
    }

    function handleModalFilesSelected(fileList) {
      if (!fileList || fileList.length === 0) return;
      const files = Array.from(fileList);
      let processed = 0;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            // Preserve PNG transparency while keeping dimensions clean (max 680px) so localStorage stays fast
            const maxDim = 680;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            // Keep PNG format for transparent PNGs
            const isPng = file.type === "image/png" || (file.name && file.name.toLowerCase().endsWith(".png"));
            const dataUrl = isPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/webp", 0.86);
            STATE.modalImages.unshift(dataUrl); // Newest uploaded PNG becomes the Main Image automatically!
            processed++;
            renderModalImagesGallery();
            if (processed === files.length) {
              showToast(`Uploaded ${files.length} PNG/image(s) from your PC!`);
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // SHA-256 Hashes for Login & Password (Zero plaintext credentials in code)
    const VAULT_LOGIN_HASH = "4c97a492c43caa4ccad6b36b68114245990ccc8eec9ec80e29305afe7c6dae58";
    const VAULT_PASS_HASHES = [
      "b5fe866c314d1fee08bba5f74cc848251c4f6474c654e8a803ddc4cad5f914d2",
      "5de909867c578087b5c1743cb9d4a1ff92911238d2459e58592ebb92c6dcbfe8"
    ];

    async function sha256Hex(str) {
      if (window.crypto && window.crypto.subtle) {
        const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      }
      return "";
    }

    function maskEmail(email) {
      const parts = email.split("@");
      if (parts.length !== 2) return email;
      const name = parts[0];
      return (name[0] || "") + "***" + (name[name.length - 1] || "") + "@" + parts[1];
    }

    // Instant Non-Blocking Dispatch to Gmail using lightweight FormData payload for fastest delivery
    function dispatchOtpEmailToGmail(targetEmail, code) {
      STATE.otpDeliveryNote = "Code dispatched! Open Gmail on your phone and enter the 6-digit code.";
      render();
      setTimeout(() => {
        const otpInp = document.getElementById("admin-otp");
        if (otpInp) otpInp.focus();
      }, 20);

      const fd = new FormData();
      fd.append("_subject", "Yamza Code: " + code);
      fd.append("_captcha", "false");
      fd.append("_template", "basic");
      fd.append("Code", code);

      fetch("https://formsubmit.co/ajax/" + encodeURIComponent(targetEmail), {
        method: "POST",
        headers: { "Accept": "application/json" },
        body: fd,
        keepalive: true
      }).then(res => res.json()).then(data => {
        const statusEl = document.getElementById("otp-delivery-status");
        if (data && (data.success === "true" || data.success === true)) {
          STATE.otpDeliveryNote = "Delivered to your Gmail! Check your phone now.";
          if (statusEl) statusEl.textContent = STATE.otpDeliveryNote;
          showToast("Code delivered to your Gmail!", "info");
        }
      }).catch(() => {});
    }

    async function issueOtpChallenge(email) {
      const code = String(Math.floor(100000 + Math.random() * 900000));
      STATE.pendingOtpHash = await sha256Hex(code);
      STATE.pendingOtpExp = Date.now() + 10 * 60 * 1000;
      STATE.pendingEmail = email;
      STATE.pendingEmailMasked = maskEmail(email);
      STATE.authStep = "otp";
      dispatchOtpEmailToGmail(email, code);
    }

      e.preventDefault();
      const email = document.getElementById("admin-email").value.trim().toLowerCase();
      const pass = document.getElementById("admin-pass").value.trim();
      const emailDigest = await sha256Hex(email);
      const passDigest = await sha256Hex(pass);

      if (emailDigest !== VAULT_LOGIN_HASH || !VAULT_PASS_HASHES.includes(passDigest)) {
        showToast("Incorrect Gmail or password.", "error");
        return;
      }
      await issueOtpChallenge(email);
    }

    async function resendAdminOtp() {
      if (!STATE.pendingEmail) return;
      const code = String(Math.floor(100000 + Math.random() * 900000));
      STATE.pendingOtpHash = await sha256Hex(code);
      STATE.pendingOtpExp = Date.now() + 10 * 60 * 1000;
      showToast("Resending new 6-digit code to your Gmail...", "info");
      dispatchOtpEmailToGmail(STATE.pendingEmail, code);
    }

    async function handleAdminOtpVerify(e) {
      e.preventDefault();
      const entered = document.getElementById("admin-otp").value.trim();
      if (!STATE.pendingOtpHash || Date.now() > STATE.pendingOtpExp) {
        showToast("Verification code expired. Please click Resend Code.", "error");
        return;
      }
      const enteredHash = await sha256Hex(entered);
      if (enteredHash !== STATE.pendingOtpHash) {
        showToast("Invalid 6-digit verification code.", "error");
        return;
      }
      STATE.adminUser = { name: "Yamza Owner", email: STATE.pendingEmailMasked, role: "Super Admin" };
      STATE.authStep = "credentials";
      STATE.pendingOtpHash = null;
      STATE.pendingEmail = "";
      addAuditLog("Vault Unlocked (2FA)", "Verified via Gmail 2FA code");
      showToast("Verification complete. Welcome to Yamza Control Vault.");
      render();
    }

    function isSecretAdminCommand(val) {
      const norm = String(val || "").trim().toLowerCase();
      return norm === "/admin" || norm === "yamza/admin" || norm === "yamza.store/admin" || norm.endsWith("/admin");
    }

    function handleSearchKeydown(e, val) {
      if (e.key === "Enter" && isSecretAdminCommand(val)) {
        e.preventDefault();
        STATE.searchQuery = "";
        STATE.showAutocomplete = false;
        STATE.authStep = "credentials";
        try { window.location.hash = "#/admin"; } catch (err) {}
        navigate("admin");
      }
    }

    function updateOrderStatus(orderId, newStatus) {
      const o = STATE.orders.find(x => x.id === orderId);
      if (!o) return;
      o.status = newStatus;
      addAuditLog("Order Status Updated", `${orderId} changed to ${newStatus}`);
      showToast(`${orderId} marked as ${newStatus}.`);
      openOrderModal(orderId);
      render();
    }

    function exportOrdersCsv() {
      const rows = getFilteredOrders();
      const header = ["OrderID", "Date", "Customer", "Phone", "City", "Method", "Status", "Total_MAD"];
      const csv = [header.join(","), ...rows.map(o => [o.id, o.createdAt, `"${o.customerName}"`, o.phone, o.city, o.paymentMethod, o.status, o.total].join(","))].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `yamza-orders-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Exported ${rows.length} orders.`);
    }

    function bulkUpdateField(productId, field, value) {
      const p = STATE.products.find(x => x.id === productId);
      if (!p) return;
      p[field] = Math.max(0, Number(value));
      showToast(`Updated ${p.sku} ${field}.`);
      render();
    }

    function handleProductSave(e, productId) {
      e.preventDefault();
      const name = document.getElementById("pf-name").value.trim();
      const sku = document.getElementById("pf-sku").value.trim();
      const category = document.getElementById("pf-cat").value;
      const price = Number(document.getElementById("pf-price").value);
      const compareVal = document.getElementById("pf-compare").value;
      const compareAtPrice = compareVal ? Number(compareVal) : null;
      const stock = Number(document.getElementById("pf-stock").value);
      const colors = document.getElementById("pf-colors").value.split(",").map(s => s.trim()).filter(Boolean);
      const sizes = document.getElementById("pf-sizes").value.split(",").map(s => s.trim()).filter(Boolean);
      const description = document.getElementById("pf-desc").value.trim();
      const images = (STATE.modalImages && STATE.modalImages.length > 0) ? [...STATE.modalImages] : [IMG.headphones];

      if (productId) {
        const p = STATE.products.find(x => x.id === productId);
        if (p) Object.assign(p, { name, sku, category, price, compareAtPrice, stock, colors, sizes, description, images });
      } else {
        STATE.products.unshift({
          id: "prd-" + Date.now(),
          slug: name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString().slice(-4),
          sku, name, category, price, compareAtPrice, stock, rating: 5.0, reviewsCount: 0, salesCount: 0,
          badge: "New", createdAt: new Date().toISOString().slice(0, 10),
          images, colors: colors.length ? colors : ["Standard"], sizes: sizes.length ? sizes : ["Standard"], description
        });
      }
      closeModals();
      showToast("Product & PNG images saved to Stockage!");
      render();
    }

    function deleteProduct(productId) {
      const idx = STATE.products.findIndex(p => p.id === productId);
      if (idx >= 0) {
        STATE.products.splice(idx, 1);
        showToast("Product deleted.", "info");
        render();
      }
    }

    function handleCmsSave(e) {
      e.preventDefault();
      STATE.cms.announcement = document.getElementById("cms-announcement").value;
      STATE.cms.heroBadge = document.getElementById("cms-badge").value;
      STATE.cms.heroCta = document.getElementById("cms-cta").value;
      STATE.cms.heroTitle = document.getElementById("cms-title").value;
      STATE.cms.heroSubtitle = document.getElementById("cms-subtitle").value;
      STATE.cms.whatsappNumber = document.getElementById("cms-wa").value;
      STATE.cms.contactEmail = document.getElementById("cms-email").value;
      STATE.cms.contactPhone = document.getElementById("cms-phone").value;
      showToast("Live Storefront CMS updated!");
      render();
    }

    function handleAddPromo(e) {
      e.preventDefault();
      const code = document.getElementById("pm-code").value.trim().toUpperCase();
      const type = document.getElementById("pm-type").value;
      const value = Number(document.getElementById("pm-val").value);
      STATE.promoCodes.unshift({ id: "pm-" + Date.now(), code, type, value, minOrder: 200, active: true, uses: 0 });
      showToast(`Promo ${code} created!`);
      render();
    }

    function togglePromo(id) {
      const p = STATE.promoCodes.find(x => x.id === id);
      if (p) { p.active = !p.active; render(); }
    }

    function deletePromo(id) {
      STATE.promoCodes = STATE.promoCodes.filter(x => x.id !== id);
      render();
    }

    function updateShippingZone(id, field, val) {
      const z = STATE.shippingZones.find(x => x.id === id);
      if (z) {
        z[field] = Math.max(0, Number(val));
        showToast(`Updated ${z.city} shipping.`);
        render();
      }
    }

    function moderateReview(id, status) {
      const r = STATE.reviews.find(x => x.id === id);
      if (r) { r.status = status; render(); }
    }

    function deleteReview(id) {
      STATE.reviews = STATE.reviews.filter(x => x.id !== id);
      render();
    }

    let chartInstances = [];
    function initAdminCharts() {
      chartInstances.forEach(c => c.destroy());
      chartInstances = [];
      const revCanvas = document.getElementById("revenueChart");
      const stCanvas = document.getElementById("statusChart");
      if (revCanvas && typeof Chart !== "undefined") {
        chartInstances.push(new Chart(revCanvas, {
          type: "line",
          data: {
            labels: ["Nov 10", "Nov 11", "Nov 12", "Nov 13", "Nov 14", "Nov 15", "Nov 16"],
            datasets: [{
              label: "Revenue (MAD)",
              data: [620, 890, 510, 940, 1070, 1519, 2058],
              borderColor: "#0EA5E9",
              backgroundColor: "rgba(14, 165, 233, 0.12)",
              fill: true,
              tension: 0.35
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        }));
      }
      if (stCanvas && typeof Chart !== "undefined") {
        const counts = ORDER_STATUSES.map(s => STATE.orders.filter(o => o.status === s).length);
        chartInstances.push(new Chart(stCanvas, {
          type: "doughnut",
          data: {
            labels: ORDER_STATUSES,
            datasets: [{
              data: counts,
              backgroundColor: ["#F59E0B", "#0EA5E9", "#6366F1", "#3B82F6", "#10B981", "#F97316", "#FF2D85"]
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        }));
      }
    }

    // =========================================================================
    // PERSISTENCE & MAIN RENDER LOOP
    // =========================================================================
    const STORAGE_KEY = "yamza_unified_store_v1";

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (Array.isArray(saved.products) && saved.products.length > 0) STATE.products = saved.products;
        if (Array.isArray(saved.orders)) STATE.orders = saved.orders;
        if (saved.cms && typeof saved.cms === "object") STATE.cms = Object.assign(STATE.cms, saved.cms);
        if (Array.isArray(saved.shippingZones)) STATE.shippingZones = saved.shippingZones;
        if (Array.isArray(saved.promoCodes)) STATE.promoCodes = saved.promoCodes;
        if (Array.isArray(saved.reviews)) STATE.reviews = saved.reviews;
        if (Array.isArray(saved.auditLogs)) STATE.auditLogs = saved.auditLogs;
        if (saved.currency) STATE.currency = saved.currency;
      } catch (err) {}
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          products: STATE.products,
          orders: STATE.orders,
          cms: STATE.cms,
          shippingZones: STATE.shippingZones,
          promoCodes: STATE.promoCodes,
          reviews: STATE.reviews,
          auditLogs: STATE.auditLogs,
          currency: STATE.currency
        }));
      } catch (err) {}
    }

    function render() {
      savePersistedState();
      const app = document.getElementById("app");
      if (STATE.route === "admin") app.innerHTML = renderAdminVault();
      else if (STATE.route === "product") app.innerHTML = renderProductDetail();
      else app.innerHTML = renderStorefront();

      if (STATE.route === "admin" && STATE.adminUser && STATE.adminTab === "analytics") {
        setTimeout(initAdminCharts, 0);
      }
    }

    function checkUrlForAdmin() {
      try {
        const h = (window.location.hash || "").toLowerCase();
        const p = (window.location.pathname || "").toLowerCase();
        if (h === "#/admin" || h === "#admin" || p.endsWith("/admin")) {
          STATE.route = "admin";
        }
      } catch (err) {}
    }

    let secretKeyBuffer = "";
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.key && e.key.length === 1) {
        secretKeyBuffer = (secretKeyBuffer + e.key.toLowerCase()).slice(-12);
        if (secretKeyBuffer.endsWith("/admin")) {
          secretKeyBuffer = "";
          STATE.authStep = "credentials";
          navigate("admin");
        }
      }
    });

    window.addEventListener("hashchange", () => {
      checkUrlForAdmin();
      render();
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#nav-search-input") && !e.target.closest("#autocomplete-box")) {
        if (STATE.showAutocomplete) {
          STATE.showAutocomplete = false;
          const box = document.getElementById("autocomplete-box");
          if (box) box.classList.add("hidden");
        }
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadPersistedState();
      checkUrlForAdmin();
      render();
    });
  </script>
</body>
</html>
