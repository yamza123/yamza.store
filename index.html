    function formatPrice(madAmount) {
      const cfg = CURRENCY_CONFIG[STATE.currency] || CURRENCY_CONFIG.MAD;
      const converted = (Number(madAmount || 0) * cfg.rate);
      const formatted = STATE.currency === "MAD"
        ? Math.round(converted).toLocaleString("en-US")
        : converted.toFixed(2);
      return cfg.position === "before" ? `${cfg.symbol}${formatted}` : `${formatted} ${cfg.symbol}`;
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      const colors = type === "error"
        ? "bg-slate-900 border-hotpink text-white"
        : type === "info"
        ? "bg-skybrand border-skybrand text-white"
        : "bg-slate-900 border-skybrand text-white";
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border-l-4 shadow-xl text-sm font-medium transition-all duration-300 ${colors}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(8px)";
        setTimeout(() => el.remove(), 250);
      }, 3200);
    }

    function addAuditLog(action, detail) {
      const now = new Date();
      const ts = now.toISOString().slice(0, 16).replace("T", " ");
      STATE.auditLogs.unshift({

        Delivered: "bg-emerald-50 text-emerald-700 border-emerald-200",
        Returned: "bg-orange-50 text-orange-700 border-orange-200",

    function addToCart(productId, variant = null, qty = 1) {
      const p = STATE.products.find(x => x.id === productId);
      if (!p || p.stock <= 0) {
        showToast("This item is currently out of stock.", "error");
        return;
      }
      const chosenVariant = variant || `${p.colors[0] || "Default"} / ${p.sizes[0] || "Standard"}`;
      const existing = STATE.cart.find(c => c.productId === productId && c.variant === chosenVariant);
      if (existing) {
        if (existing.qty + qty > p.stock) {
          showToast(`Only ${p.stock} units available in stock.`, "error");
          return;
        }
        existing.qty += qty;
      } else {
        STATE.cart.push({
          productId: p.id,
          name: p.name,
          image: p.images[0],
          price: p.price,
          variant: chosenVariant,
          qty: Math.min(qty, p.stock)
        });
      }
      showToast(`Added "${p.name}" to your cart.`);
      render();
      openCartDrawer();
    }

    function toggleWishlist(productId) {
      const idx = STATE.wishlist.indexOf(productId);
      if (idx >= 0) {
        STATE.wishlist.splice(idx, 1);
        showToast("Removed from wishlist.", "info");
      } else {
        STATE.wishlist.push(productId);
        showToast("Saved to your Yamza wishlist.");
      }
      render();
    }

    function calculateShipping(city, subtotal) {
      const zone = STATE.shippingZones.find(z => z.city === city) || STATE.shippingZones[0];
      if (!zone) return 30;
      return subtotal >= zone.freeThreshold ? 0 : zone.fee;
    }

    function placeOrder({ customerName, phone, city, address, paymentMethod, items, promoCode = null, notes = "" }) {
      const subtotal = items.reduce((s, it) => s + it.price * it.qty, 0);
      let discount = 0;
      if (promoCode) {
        const pc = STATE.promoCodes.find(c => c.code.toUpperCase() === promoCode.toUpperCase() && c.active);
        if (pc && subtotal >= pc.minOrder) {
          discount = pc.type === "percent" ? Math.round(subtotal * (pc.value / 100)) : pc.value;
          pc.uses += 1;
        }
      }
      const shippingFee = calculateShipping(city, subtotal);
      const total = Math.max(0, subtotal - discount + shippingFee);
      const nextNum = 1049 + STATE.orders.length;
      const newOrder = {
        id: `YMZ-${nextNum}`,
        createdAt: new Date().toISOString().slice(0, 16).replace("T", " "),
        customerName: customerName.trim(),
        phone: phone.trim(),
        city,
        address: address.trim(),
        paymentMethod,
        status: "Pending",
        subtotal,
        shippingFee,
        discount,
        total,
        notes,
        items: items.map(it => ({
          productId: it.productId,
          name: it.name,
          variant: it.variant,
          qty: it.qty,
          price: it.price
        }))
      };
      // Decrement stock & increment salesCount
      items.forEach(it => {
        const prod = STATE.products.find(p => p.id === it.productId);
        if (prod) {
          prod.stock = Math.max(0, prod.stock - it.qty);
          prod.salesCount += it.qty;
        }
      });
      STATE.orders.unshift(newOrder);
      addAuditLog("New Order Received", `${newOrder.id} (${paymentMethod}) — ${formatPrice(total)} from ${customerName}`);
      return newOrder;
    }

    function getFilteredProducts() {

        list = list.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.description.toLowerCase().includes(q));

      if (STATE.filters.category !== "All") {
        list = list.filter(p => p.category === STATE.filters.category);
      }
      list = list.filter(p => p.price <= STATE.filters.maxPrice);
      if (STATE.filters.minRating > 0) {
        list = list.filter(p => p.rating >= STATE.filters.minRating);
      }
      if (STATE.filters.inStockOnly) {
        list = list.filter(p => p.stock > 0);
      }
      if (STATE.filters.sort === "newest") list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      else if (STATE.filters.sort === "bestselling") list.sort((a, b) => b.salesCount - a.salesCount);
      else if (STATE.filters.sort === "price_asc") list.sort((a, b) => a.price - b.price);
      else if (STATE.filters.sort === "price_desc") list.sort((a, b) => b.price - a.price);
      return list;
    }

              <div class="lg:col-span-6 relative">

                  <div class="flex-1 min-w-0">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-hotpink">Top Pick Today</div>
                    <div class="text-sm font-bold text-slate-900 truncate">${escapeHtml(featured[0].name)}</div>
                    <div class="text-xs font-bold text-skybrand">${formatPrice(featured[0].price)}</div>
                  </div>
                  <button onclick="navigate('product','${featured[0].slug}')" class="bg-skybrand hover:bg-sky-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition">View</button>
                </div>
              </div>
            </div>
          </section>

          <!-- Category Pills + Catalog Section -->
          <section id="catalog-section" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
              <div>
                <h2 class="font-display text-3xl font-bold text-slate-900">Curated Catalog</h2>
                <p class="text-sm text-slate-500 mt-1">Filter by category, price, rating, or availability — order instantly via COD or Cart.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                ${["All", ...STATE.cms.featuredCategories].map(c => `
                  <button onclick="selectCategory('${escapeHtml(c)}')"
                    class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition ${STATE.filters.category === c ? "bg-skybrand text-white shadow-sm" : "bg-ice text-slate-700 hover:bg-sky-50 border border-slate-200"}">
                    ${escapeHtml(c)}
                  </button>
                `).join("")}
              </div>
            </div>

            <!-- Filter & Sort Bar -->
            <div class="bg-ice border border-slate-200/80 rounded-2xl p-4 mb-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-center">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Max Price: <span class="text-skybrand">${formatPrice(STATE.filters.maxPrice)}</span></label>
                <input type="range" min="200" max="2500" step="50" value="${STATE.filters.maxPrice}"
                  oninput="STATE.filters.maxPrice = Number(this.value); render()"
                  class="w-full accent-skybrand cursor-pointer" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Minimum Rating</label>
                <select onchange="STATE.filters.minRating = Number(this.value); render()" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:border-skybrand">
                  <option value="0" ${STATE.filters.minRating === 0 ? "selected" : ""}>All Ratings</option>
                  <option value="4.5" ${STATE.filters.minRating === 4.5 ? "selected" : ""}>4.5★ &amp; Up</option>
                  <option value="4.8" ${STATE.filters.minRating === 4.8 ? "selected" : ""}>4.8★ &amp; Up</option>
                </select>
              </div>
              <div class="flex items-center gap-2 pt-3 sm:pt-4">
                <input id="in-stock-chk" type="checkbox" ${STATE.filters.inStockOnly ? "checked" : ""}
                  onchange="STATE.filters.inStockOnly = this.checked; render()"
                  class="w-4 h-4 accent-skybrand rounded cursor-pointer" />
                <label for="in-stock-chk" class="text-sm font-semibold text-slate-700 cursor-pointer">In Stock Only</label>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Sort By</label>
                <select onchange="STATE.filters.sort = this.value; render()" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:border-skybrand">
                  <option value="bestselling" ${STATE.filters.sort === "bestselling" ? "selected" : ""}>Best Selling</option>
                  <option value="newest" ${STATE.filters.sort === "newest" ? "selected" : ""}>Newest Arrivals</option>
                  <option value="price_asc" ${STATE.filters.sort === "price_asc" ? "selected" : ""}>Price: Low to High</option>
                  <option value="price_desc" ${STATE.filters.sort === "price_desc" ? "selected" : ""}>Price: High to Low</option>
                </select>
              </div>
            </div>

            <!-- Product Grid -->
            ${products.length === 0 ? `
              <div class="bg-ice border border-slate-200 rounded-3xl p-12 text-center">
                <p class="text-lg font-bold text-slate-800">No products match your filters.</p>
                <button onclick="resetFilters()" class="mt-4 bg-skybrand text-white px-5 py-2.5 rounded-full text-sm font-bold">Reset Filters</button>
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                ${products.map(p => renderProductCard(p)).join("")}
              </div>
            `}
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    function renderProductCard(p) {
      const isWished = STATE.wishlist.includes(p.id);
      const outOfStock = p.stock <= 0;
      return `
        <article class="group bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
          <div class="relative bg-ice aspect-square overflow-hidden">
            <img src="${p.images[0]}" alt="${escapeHtml(p.name)}" onclick="navigate('product','${p.slug}')"
              class="w-full h-full object-cover cursor-pointer group-hover:scale-105 transition duration-500" />
            <!-- Badges -->
            <div class="absolute top-3 left-3 flex flex-col gap-1.5">
              ${p.badge === "Sale" ? `<span class="bg-hotpink text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm">SALE</span>` : ""}
              ${p.badge === "New" ? `<span class="bg-skybrand text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm">NEW</span>` : ""}
              ${outOfStock ? `<span class="bg-slate-900 text-white text-[11px] font-bold px-2.5 py-1 rounded-full">OUT OF STOCK</span>` : ""}
            </div>
            <!-- Quick Actions -->
            <div class="absolute top-3 right-3 flex flex-col gap-2">
              <button onclick="toggleWishlist('${p.id}')" class="w-9 h-9 rounded-full bg-white/90 backdrop-blur shadow flex items-center justify-center ${isWished ? "text-hotpink" : "text-slate-500 hover:text-hotpink"} transition">
                <svg class="w-4 h-4 ${isWished ? "fill-current" : ""}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              </button>
              <button onclick="openQuickView('${p.id}')" title="Quick View" class="w-9 h-9 rounded-full bg-white/90 backdrop-blur shadow flex items-center justify-center text-slate-600 hover:text-skybrand transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div class="p-5 flex-1 flex flex-col justify-between gap-3">
            <div>
              <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                <span class="font-semibold text-skybrand">${escapeHtml(p.category)}</span>
                <span class="font-semibold text-amber-500">★ ${p.rating.toFixed(1)} <span class="text-slate-400">(${p.reviewsCount})</span></span>
              </div>
              <h3 onclick="navigate('product','${p.slug}')" class="font-bold text-slate-900 text-base leading-snug cursor-pointer hover:text-skybrand transition line-clamp-2">
                ${escapeHtml(p.name)}
              </h3>
            </div>

            <div class="space-y-3">
              <div class="flex items-baseline gap-2">
                <span class="text-lg font-extrabold text-slate-900">${formatPrice(p.price)}</span>
                ${p.compareAtPrice ? `<span class="text-xs text-slate-400 line-through">${formatPrice(p.compareAtPrice)}</span>` : ""}
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="addToCart('${p.id}')" ${outOfStock ? "disabled" : ""}
                  class="py-2.5 px-3 rounded-xl text-xs font-bold transition ${outOfStock ? "bg-slate-100 text-slate-400 cursor-not-allowed" : "bg-hotpink hover:bg-pinkhover text-white shadow-sm"}">
                  Add to Cart
                </button>
                <button onclick="navigate('product','${p.slug}')"
                  class="py-2.5 px-3 rounded-xl text-xs font-bold bg-ice hover:bg-sky-50 text-skybrand border border-sky-200 transition">
                  Express COD
                </button>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    // =========================================================================
    // PRODUCT DETAIL PAGE (PDP) WITH DUAL CHECKOUT
    // =========================================================================
    function renderProductDetail() {
      const p = STATE.products.find(x => x.slug === STATE.activeProductSlug) || STATE.products[0];
      const activeImg = p.images[STATE.pdp.selectedImageIdx] || p.images[0];
      const approvedReviews = STATE.reviews.filter(r => r.productId === p.id && r.status === "Approved");
      const defaultCity = STATE.shippingZones[0].city;
      const subtotal = p.price * STATE.pdp.codQty;
      const shipFee = calculateShipping(defaultCity, subtotal);

      return `
        ${renderNavbar()}
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
          <!-- Breadcrumb -->
          <div class="flex items-center gap-2 text-xs sm:text-sm text-slate-500 mb-6">
            <button onclick="navigate('store')" class="hover:text-skybrand font-semibold">Home</button>
            <span>/</span>
            <button onclick="selectCategory('${escapeHtml(p.category)}')" class="hover:text-skybrand font-semibold">${escapeHtml(p.category)}</button>
            <span>/</span>
            <span class="text-slate-900 font-semibold truncate">${escapeHtml(p.name)}</span>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Left: Multi-Image Gallery with Zoom -->
            <div class="lg:col-span-6 space-y-4">
              <div class="zoom-container rounded-3xl bg-ice border border-slate-200 aspect-square shadow-sm">
                <img src="${activeImg}" alt="${escapeHtml(p.name)}" class="w-full h-full object-cover" />
              </div>
              <div class="flex items-center gap-3">
                ${p.images.map((img, i) => `
                  <button onclick="STATE.pdp.selectedImageIdx = ${i}; render()"
                    class="w-20 h-20 rounded-2xl overflow-hidden border-2 transition ${STATE.pdp.selectedImageIdx === i ? "border-skybrand ring-2 ring-skybrand/20" : "border-slate-200 opacity-75 hover:opacity-100"}">
                    <img src="${img}" alt="Thumbnail ${i + 1}" class="w-full h-full object-cover" />
                  </button>
                `).join("")}
              </div>
            </div>

            <!-- Right: Info, Variant Selectors & Dual Checkout -->
            <div class="lg:col-span-6 space-y-6">
              <div>
                <div class="flex items-center gap-3 mb-2">
                  <span class="bg-sky-50 text-skybrand text-xs font-bold px-3 py-1 rounded-full">${escapeHtml(p.category)}</span>
                  <span class="text-xs font-semibold text-amber-500">★ ${p.rating.toFixed(1)} (${p.reviewsCount} reviews)</span>
                  <span class="text-xs font-bold ${p.stock > 8 ? "text-emerald-600" : p.stock > 0 ? "text-amber-600" : "text-rose-600"}">
                    ${p.stock > 8 ? `In Stock (${p.stock} left)` : p.stock > 0 ? `Low Stock: Only ${p.stock} left!` : "Out of Stock"}
                  </span>
                </div>
                <h1 class="font-display text-3xl sm:text-4xl font-bold text-slate-900">${escapeHtml(p.name)}</h1>
                <div class="flex items-baseline gap-3 mt-3">
                  <span class="text-3xl font-extrabold text-slate-900">${formatPrice(p.price)}</span>
                  ${p.compareAtPrice ? `<span class="text-lg text-slate-400 line-through">${formatPrice(p.compareAtPrice)}</span>` : ""}
                  ${p.compareAtPrice ? `<span class="bg-hotpink text-white text-xs font-bold px-2.5 py-1 rounded-full">SAVE ${Math.round((1 - p.price / p.compareAtPrice) * 100)}%</span>` : ""}
                </div>
                <p class="text-sm text-slate-600 leading-relaxed mt-4">${escapeHtml(p.description)}</p>
              </div>

              <!-- Variant Selectors -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Color / Edition</label>
                  <div class="flex flex-wrap gap-2">
                    ${p.colors.map(c => `
                      <button onclick="STATE.pdp.selectedColor = '${escapeHtml(c)}'; render()"
                        class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${(STATE.pdp.selectedColor || p.colors[0]) === c ? "border-skybrand bg-sky-50 text-skybrand" : "border-slate-200 text-slate-700 hover:border-slate-300"}">
                        ${escapeHtml(c)}
                      </button>
                    `).join("")}
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Size / Pack</label>
                  <div class="flex flex-wrap gap-2">
                    ${p.sizes.map(s => `
                      <button onclick="STATE.pdp.selectedSize = '${escapeHtml(s)}'; render()"
                        class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${(STATE.pdp.selectedSize || p.sizes[0]) === s ? "border-skybrand bg-sky-50 text-skybrand" : "border-slate-200 text-slate-700 hover:border-slate-300"}">
                        ${escapeHtml(s)}
                      </button>
                    `).join("")}
                  </div>
                </div>
              </div>

              <!-- Standard Add to Cart Button -->
              <div class="flex gap-3">
                <button onclick="addToCart('${p.id}', '${escapeHtml((STATE.pdp.selectedColor || p.colors[0]) + " / " + (STATE.pdp.selectedSize || p.sizes[0]))}', STATE.pdp.codQty)"
                  ${p.stock <= 0 ? "disabled" : ""}
                  class="flex-1 py-3.5 px-6 rounded-2xl font-bold text-sm transition ${p.stock <= 0 ? "bg-slate-200 text-slate-400 cursor-not-allowed" : "bg-skybrand hover:bg-sky-600 text-white shadow-md"}">
                  Add to Cart — ${formatPrice(p.price)}
                </button>
                <button onclick="toggleWishlist('${p.id}')" class="px-4 rounded-2xl border border-slate-200 hover:border-hotpink text-slate-700 hover:text-hotpink transition">
                  ♥
                </button>
              </div>

              <!-- Express COD Order Form -->
              <div class="bg-ice border-2 border-skybrand/30 rounded-3xl p-6 shadow-sm space-y-4">
                <div class="flex items-center justify-between">
                  <div>
                    <span class="text-[11px] font-extrabold uppercase tracking-widest text-hotpink">Instant 1-Step Checkout</span>
                    <h3 class="font-display text-xl font-bold text-slate-900">Express Cash on Delivery (COD)</h3>
                  </div>
                  <span class="bg-skybrand text-white text-xs font-bold px-3 py-1 rounded-full">Pay on Arrival</span>
                </div>

                <form onsubmit="handleExpressCodSubmit(event, '${p.id}')" class="space-y-3">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input id="cod-name" type="text" required placeholder="Full Name *" class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-skybrand" />
                    <input id="cod-phone" type="tel" required placeholder="Phone Number * (e.g. +212 6...)" class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-skybrand" />
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <select id="cod-city" onchange="updateCodLiveTotal(${p.price})" class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:border-skybrand">
                      ${STATE.shippingZones.map(z => `<option value="${escapeHtml(z.city)}">${escapeHtml(z.city)} (${z.eta})</option>`).join("")}
                    </select>
                    <div class="flex items-center bg-white border border-slate-200 rounded-xl px-3 py-1.5 justify-between">
                      <span class="text-xs font-bold text-slate-500">Quantity</span>
                      <div class="flex items-center gap-3">
                        <button type="button" onclick="changeCodQty(-1, ${p.stock}, ${p.price})" class="w-7 h-7 rounded-lg bg-ice font-bold text-slate-700 hover:bg-slate-200">-</button>
                        <span id="cod-qty-display" class="text-sm font-bold w-5 text-center">${STATE.pdp.codQty}</span>
                        <button type="button" onclick="changeCodQty(1, ${p.stock}, ${p.price})" class="w-7 h-7 rounded-lg bg-ice font-bold text-slate-700 hover:bg-slate-200">+</button>
                      </div>
                    </div>
                  </div>
                  <input id="cod-address" type="text" required placeholder="Full Street Address &amp; Neighborhood *" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-skybrand" />

                  <div id="cod-live-summary" class="bg-white rounded-2xl p-3.5 border border-slate-200 flex items-center justify-between text-sm">
                    <div>
                      <div class="text-xs text-slate-500">Subtotal + Shipping</div>
                      <div class="font-bold text-slate-900">Total to Pay on Delivery</div>
                    </div>
                    <div class="text-right">
                      <div class="text-xs text-skybrand font-semibold">${shipFee === 0 ? "Free Shipping!" : `+ ${formatPrice(shipFee)} shipping`}</div>
                      <div class="text-xl font-extrabold text-hotpink">${formatPrice(subtotal + shipFee)}</div>
                    </div>
                  </div>

                  <button type="submit" ${p.stock <= 0 ? "disabled" : ""}
                    class="w-full py-3.5 rounded-2xl font-bold text-sm transition ${p.stock <= 0 ? "bg-slate-200 text-slate-400 cursor-not-allowed" : "bg-hotpink hover:bg-pinkhover text-white shadow-lg shadow-hotpink/25"}">
                    Order Now — Cash on Delivery
                  </button>
                </form>
              </div>

              <!-- Trust Badges -->
              <div class="grid grid-cols-3 gap-3 pt-2">
                <div class="bg-ice p-3 rounded-2xl text-center border border-slate-100">
                  <div class="text-skybrand font-bold text-xs">Fast Delivery</div>
                  <div class="text-[11px] text-slate-500 mt-0.5">24–48h Nationwide</div>
                </div>
                <div class="bg-ice p-3 rounded-2xl text-center border border-slate-100">
                  <div class="text-skybrand font-bold text-xs">Cash on Delivery</div>
                  <div class="text-[11px] text-slate-500 mt-0.5">Inspect &amp; Pay</div>
                </div>
                <div class="bg-ice p-3 rounded-2xl text-center border border-slate-100">
                  <div class="text-skybrand font-bold text-xs">Quality Guarantee</div>
                  <div class="text-[11px] text-slate-500 mt-0.5">7-Day Easy Return</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Customer Reviews Section -->
          <section class="mt-16 pt-12 border-t border-slate-200 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-4">
              <h2 class="font-display text-2xl font-bold text-slate-900">Verified Customer Reviews (${approvedReviews.length})</h2>
              ${approvedReviews.length === 0 ? `<p class="text-sm text-slate-500">No approved reviews yet for this item. Be the first!</p>` : approvedReviews.map(r => `
                <div class="bg-ice border border-slate-100 rounded-2xl p-5">
                  <div class="flex items-center justify-between mb-2">
                    <span class="font-bold text-sm text-slate-900">${escapeHtml(r.author)}</span>
                    <span class="text-xs text-slate-400">${escapeHtml(r.date)}</span>
                  </div>
                  <div class="text-amber-500 text-xs font-bold mb-1.5">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div>
                  <p class="text-sm text-slate-600">${escapeHtml(r.comment)}</p>
                </div>
              `).join("")}
            </div>
            <div class="lg:col-span-5 bg-ice border border-slate-200 rounded-3xl p-6 h-fit">
              <h3 class="font-bold text-base text-slate-900 mb-3">Leave a Review</h3>
              <form onsubmit="handleNewReview(event, '${p.id}')" class="space-y-3">
                <input id="rev-author" type="text" required placeholder="Your Name" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2 text-sm" />
                <select id="rev-rating" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2 text-sm">
                  <option value="5">5 Stars — Excellent</option>
                  <option value="4">4 Stars — Very Good</option>
                  <option value="3">3 Stars — Good</option>
                  <option value="2">2 Stars — Fair</option>
                  <option value="1">1 Star — Poor</option>
                </select>
                <textarea id="rev-comment" rows="3" required placeholder="Share your experience..." class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2 text-sm"></textarea>
                <button type="submit" class="w-full bg-skybrand hover:bg-sky-600 text-white font-bold py-2.5 rounded-xl text-sm transition">Submit Review</button>
              </form>
            </div>
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    // =========================================================================
    // /admin CONTROL VAULT
    // =========================================================================
    function renderAdminLogin() {
      const isOtpStep = STATE.authStep === "otp";
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-900 to-sky-950 flex flex-col items-center justify-center p-4">
          ${isOtpStep && STATE.simulatedInboxOtp ? `
            <div class="w-full max-w-md mb-4 bg-white/95 backdrop-blur border-l-4 border-skybrand rounded-2xl p-4 shadow-2xl flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-xl bg-red-50 text-red-600 flex items-center justify-center font-extrabold text-sm shrink-0">M</div>
                <div>
                  <div class="text-[11px] font-bold uppercase tracking-wider text-skybrand">Gmail Security Alert • ${escapeHtml(STATE.pendingEmailMasked)}</div>
                  <div class="text-xs font-bold text-slate-900 mt-0.5">Yamza Admin Verification Code</div>
                  <div class="text-xs text-slate-600 mt-1">Your one-time verification code is: <span class="font-mono font-extrabold text-sm text-hotpink bg-rose-50 px-2 py-0.5 rounded">${escapeHtml(STATE.simulatedInboxOtp)}</span></div>
                </div>
              </div>
              <button onclick="STATE.simulatedInboxOtp=null; render()" class="text-slate-400 hover:text-slate-600 text-xs font-bold">✕</button>
            </div>

    function getFilteredOrders() {

          const q = STATE.ordersFilter.search.toLowerCase();
          if (!o.id.toLowerCase().includes(q) && !o.customerName.toLowerCase().includes(q) && !o.phone.toLowerCase().includes(q) && !o.city.toLowerCase().includes(q)) return false;
        }
        const oDate = o.createdAt.slice(0, 10);
        if (STATE.ordersFilter.dateFrom && oDate < STATE.ordersFilter.dateFrom) return false;
        if (STATE.ordersFilter.dateTo && oDate > STATE.ordersFilter.dateTo) return false;
        return true;
      });

    const VAULT_LOGIN_HASH = "4c97a492c43caa4ccad6b36b68114245990ccc8eec9ec80e29305afe7c6dae58";
    const VAULT_PASS_HASHES = ['b5fe866c314d1fee08bba5f74cc848251c4f6474c654e8a803ddc4cad5f914d2', '5de909867c578087b5c1743cb9d4a1ff92911238d2459e58592ebb92c6dcbfe8'];

    async function sha256Hex(str) {
      if (window.crypto && window.crypto.subtle) {
        const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      }
      return "";
    }

    function maskEmail(email) {
      const parts = email.split("@");
      if (parts.length !== 2) return email;
      const name = parts[0];
      return (name[0] || "") + "***" + (name[name.length - 1] || "") + "@" + parts[1];
    }

    async function issueOtpChallenge(email) {
      const code = String(Math.floor(100000 + Math.random() * 900000));
      STATE.pendingOtpHash = await sha256Hex(code);
      STATE.pendingOtpExp = Date.now() + 10 * 60 * 1000;
      STATE.pendingEmailMasked = maskEmail(email);
      STATE.simulatedInboxOtp = code;
      STATE.authStep = "otp";
      showToast("Verification code sent to your Gmail (" + STATE.pendingEmailMasked + ").", "info");
      render();
      try {
        await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(email), {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            _subject: "Yamza Admin Verification Code: " + code,
            verification_code: code,
            message: "Your Yamza /admin verification code is: " + code + " (valid for 10 minutes)."
          })
        });
      } catch (err) {}
      setTimeout(() => {
        const otpInp = document.getElementById("admin-otp");
        if (otpInp) otpInp.focus();
      }, 50);
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById("admin-email").value.trim().toLowerCase();
      const pass = document.getElementById("admin-pass").value.trim();
      const emailDigest = await sha256Hex(email);
      const passDigest = await sha256Hex(pass);

      if (emailDigest !== VAULT_LOGIN_HASH || !VAULT_PASS_HASHES.includes(passDigest)) {
        showToast("Incorrect Gmail or password.", "error");
        return;
      }
      await issueOtpChallenge(email);
    }

    async function resendAdminOtp() {
      const code = String(Math.floor(100000 + Math.random() * 900000));
      STATE.pendingOtpHash = await sha256Hex(code);
      STATE.pendingOtpExp = Date.now() + 10 * 60 * 1000;
      STATE.simulatedInboxOtp = code;
      showToast("New 6-digit verification code sent to Gmail.", "info");
      render();
    }

    async function handleAdminOtpVerify(e) {
      e.preventDefault();
      const entered = document.getElementById("admin-otp").value.trim();
      if (!STATE.pendingOtpHash || Date.now() > STATE.pendingOtpExp) {
        showToast("Verification code expired. Please request a new code.", "error");
        return;
      }
      const enteredHash = await sha256Hex(entered);
      if (enteredHash !== STATE.pendingOtpHash) {
        showToast("Invalid 6-digit verification code.", "error");
        return;
      }
      STATE.adminUser = { name: "Yamza Owner", email: STATE.pendingEmailMasked, role: "Super Admin" };
      STATE.authStep = "credentials";
      STATE.pendingOtpHash = null;
      STATE.simulatedInboxOtp = null;
      addAuditLog("Vault Unlocked (2FA)", "Verified via Gmail 2FA code");
      showToast("Verification complete. Welcome to Yamza Control Vault.");
      render();
    }

    const STORAGE_KEY = "yamza_unified_store_v1";

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (Array.isArray(saved.products) && saved.products.length > 0) STATE.products = saved.products;
        if (Array.isArray(saved.orders)) STATE.orders = saved.orders;
        if (saved.cms && typeof saved.cms === "object") STATE.cms = Object.assign(STATE.cms, saved.cms);
        if (Array.isArray(saved.shippingZones)) STATE.shippingZones = saved.shippingZones;
        if (Array.isArray(saved.promoCodes)) STATE.promoCodes = saved.promoCodes;
        if (Array.isArray(saved.reviews)) STATE.reviews = saved.reviews;
        if (Array.isArray(saved.auditLogs)) STATE.auditLogs = saved.auditLogs;
        if (saved.currency) STATE.currency = saved.currency;
      } catch (err) {}
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          products: STATE.products,
          orders: STATE.orders,
          cms: STATE.cms,
          shippingZones: STATE.shippingZones,
          promoCodes: STATE.promoCodes,
          reviews: STATE.reviews,
          auditLogs: STATE.auditLogs,
          currency: STATE.currency
        }));
      } catch (err) {}
    }

    function render() {
      savePersistedState();
      const app = document.getElementById("app");
      if (STATE.route === "admin") app.innerHTML = renderAdminVault();
      else if (STATE.route === "product") app.innerHTML = renderProductDetail();
      else app.innerHTML = renderStorefront();

      if (STATE.route === "admin" && STATE.adminUser && STATE.adminTab === "analytics") {
        setTimeout(initAdminCharts, 0);
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#nav-search-input") && !e.target.closest("#autocomplete-box")) {
        if (STATE.showAutocomplete) {
          STATE.showAutocomplete = false;
          const box = document.getElementById("autocomplete-box");
          if (box) box.classList.add("hidden");
        }
      }
    });

    function checkUrlForAdmin() {
      try {
        const h = (window.location.hash || "").toLowerCase();
        const p = (window.location.pathname || "").toLowerCase();
        if (h === "#/admin" || h === "#admin" || p.endsWith("/admin")) {
          STATE.route = "admin";
        }
      } catch (err) {}
    }

    let secretKeyBuffer = "";
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.key && e.key.length === 1) {
        secretKeyBuffer = (secretKeyBuffer + e.key.toLowerCase()).slice(-12);
        if (secretKeyBuffer.endsWith("/admin")) {
          secretKeyBuffer = "";
          STATE.authStep = "credentials";
          navigate("admin");
        }
      }
    });

    window.addEventListener("hashchange", () => {
      checkUrlForAdmin();
      render();
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadPersistedState();
      checkUrlForAdmin();
      render();
    });
  </script>
</body>
</html>
